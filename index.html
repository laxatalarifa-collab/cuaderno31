9","La Foncalada","Alternativa de final","Agua sobre acero","Pieza sonora autónoma, sin intervenir en el monumento; ondas iluminadas hasta una última gota.","Validar emplazamiento, ruido, lluvia y traslado."],["E10","Local junto a La Vega","Alternativa de final","Una obra que continúa","Buscar local con escaparate o entrada visible en Campo de la Vega o Tenderina Alta. No hay inmueble elegido.","Localizar espacio, acordar uso, ensayar y sostener un proceso real."],["E11","Santullano","Idea explorada","Voz interior y danza exterior","Se estudió una pieza vocal interior y un solo exterior. Fuera de las tres alternativas actuales.","Solo reconsiderar con acuerdo específico y comprobación de horarios."]],"route":[[1,"Las Caldas","E01","Ruralidad y agua","Centro social, residencia y lavadero; conexión en bicicleta posible.","Pendiente"],[2,"Tren de memoria","E02","Desplazarse también cuenta","Relatos, artistas y músicas incorporados al trayecto.","Pendiente"],[3,"Mieres / Pozo Santa Bárbara","E03","Memoria industrial","Memoria minera y reconversión cultural.","Pendiente"],[4,"Naranco","E04","Montaña y mirada","Encuentro de arte, ciencia, tradición y oralidad.","Pendiente"],[5,"Comida en Rúa 13","E05","Mesa y hospitalidad","Descansar y conversar sin presentación añadida.","Pendiente"],[6,"Centro histórico","E06","Ciudad y patrimonio","Selección breve ligada al relato.","Pendiente"],[7,"La Vega","E07","Futuros compartidos","Clímax colectivo; infancia y migración transversales.","Pendiente"],[8,"Epílogo","E08 / E09 / E10","Atención concentrada","Un lugar nuevo, una imagen y una acción breve, sin discurso posterior.","Por elegir"]],"contacts":[["C01","Adrián Vega","Acompañamiento artístico y coaching","General","adrianvega.info@gmail.com","Correo verificado","Acompañamiento artístico y coaching; también comparte materiales de trabajo."],["C02","Asturias ConBici / Masa Crítica","Conexión en bicicleta","Las Caldas / recorrido","","Participación propuesta","Confirmar interlocución y recorrido."],["C03","Coro Minero de Turón","Voces","Mieres / Pozo Santa Bárbara","","Participación propuesta","Contactar y concretar intervención."],["C04","Gaiteros del Carbón","Música","Mieres / Pozo Santa Bárbara","","Participación propuesta","Contactar y concretar intervención."],["C05","Marisa Valle Roso","Música / voz","Mieres / Pozo Santa Bárbara","","Participación propuesta","Contactar y comprobar disponibilidad."],["C06","Carlos Sotín","Arte, ciencia u oralidad","Naranco","","Nombre por verificar","Verificar nombre y función exacta."],["C07","Alicia Villanueva","Arte, ciencia u oralidad","Naranco","","Participación propuesta","Verificar función y disponibilidad."],["C08","Luz Cristóbal","Arte, ciencia u oralidad","Naranco","","Participación propuesta","Verificar función y disponibilidad."],["C09","Tres cocineros por identificar","Gastronomía","Rúa 13","","Por identificar","Identificar responsables y propuesta."],["C10","Museo Arqueológico: interlocutor por identificar","Uso artístico del claustro","Final A","","Por identificar","Consultar disponibilidad y condiciones."],["C11","Artista sonora por identificar","Agua y acero","Final B","","Por identificar","Definir autoría, pieza y necesidades."],["C12","Seis intérpretes por identificar","Creación con tejido","Final C","","Por identificar","Definir autoría, reparto y continuidad."],["C13","Responsable del local por identificar","Cesión del espacio","Final C","","Por identificar","Buscar inmueble y acordar uso."],["C14","Óscar","Gerente de Renfe","Renfe","Oscar.saninz@renfe.es","Contacto facilitado por Adrián","Correo de Adrián Vega del 07.10.2026. Contactar y concretar colaboración."],["C15","Contacto de Renfe (nombre por confirmar)","Cargo por confirmar","Renfe","Jabecerro@renfe.es","Contacto facilitado por Adrián","Correo de Adrián Vega del 07.10.2026. Confirmar nombre y cargo; contactar y concretar colaboración."]],"sketch":[["Relato","Dramaturgia territorial de un día","Ruralidad, agua, memoria industrial, patrimonio, ciencia, oralidad, gastronomía, comunidad y futuro. Los desplazamientos forman parte del relato.","Propuesta"],["Transversalidades","Infancia y migración","Atraviesan el día y mantienen autoría y protagonismo; evitar presentarlas como símbolos o bloques separados.","Criterio"],["Epílogo","Una sola imagen","Después de La Vega, una acción de cuatro a seis minutos, acompañamiento reducido y sin discurso posterior.","Criterio"],["Final A","La última resonancia","Cuatro voces durante cinco minutos. Una voz de la mañana podría reaparecer con otro material. Emoción, tiempo largo y silencio.","Alternativa"],["Final B","Agua sobre acero","Cinco minutos de golpes, gotas y vibraciones sobre una pieza autónoma. Última imagen: algo mínimo modifica toda la superficie.","Alternativa"],["Final C","Una obra que continúa","Seis intérpretes sostienen, tensan, pliegan y transfieren una banda de tejido. Empieza antes de la llegada y continúa tras la salida; integrar en residencia real.","Alternativa"],["Otras ideas","Mecanismos explorados","Coro invisible con auriculares, superficie translúcida que revela la ciudad y taller cotidiano que continúa. No implican añadir paradas.","Explorado"]],"timeline":[[1,"Bienvenida · Hotel Las Caldas",0.4166666666666667,0.4201388888888889,5,"Inicio de la visita"],[2,"A pie · Las Caldas → Priorio",0.4201388888888889,0.4305555555555556,15,"Trayecto"],[3,"Centro social Las Caldas + albergue Priorio",0.4305555555555556,0.4479166666666667,25,"Ruralidad, participación y residencias artísticas"],[4,"Autobús · Priorio → Pozu Santa Bárbara",0.4479166666666667,0.4756944444444444,40,"Trayecto"],[5,"Pozu Santa Bárbara · Mieres",0.4756944444444444,0.5,35,"Memoria minera y reconversión cultural"],[6,"Autobús · Pozu → San Pedro de los Arcos",0.5,0.53125,45,"Trayecto"],[7,"Colegio San Pedro de los Arcos",0.53125,0.5520833333333334,30,"Diversidad, comunidad educativa y mediación"],[8,"Autobús · Colegio → Campoamor",0.5520833333333334,0.5625,15,"Trayecto"],[9,"Teatro Campoamor",0.5625,0.5763888888888888,20,"Actividad con el tejido cultural por definir"],[10,"A pie · Campoamor → Rúaquince",0.5763888888888888,0.5833333333333334,10,"Trayecto"],[11,"Comida · Palacio de la Rúa / Rúaquince",0.5833333333333334,0.625,60,"Comida y conversación"],[12,"A pie · Centro histórico → La Vega",0.625,0.6458333333333334,30,"Bellas Artes, Conservatorio, Arqueológico y Pelayas"],[13,"Fábrica de La Vega",0.6458333333333334,0.6875,60,"Transformación urbana y cultural; proyectos artísticos"],[14,"Autobús · La Vega → Bombé",0.6875,0.6979166666666666,15,"Cierre de septiembre; pendiente de revisión"],[15,"Campo de San Francisco · Paseo del Bombé",0.6979166666666666,0.71875,30,"Folixa / amagüestu; cierre de septiembre"],[16,"Autobús · Bombé → Santa María del Naranco",0.71875,0.7291666666666666,15,"Cierre de septiembre; pendiente de revisión"],[17,"Santa María del Naranco",0.7291666666666666,0.75,30,"Paisaje, prerrománico y Amabilidá; cierre de septiembre"]],"decisions":[["Fijar nave y puerta de salida de La Vega","Pendiente","Antes de elegir final"],["Cronometrar los tres itinerarios con el grupo previsto","Pendiente","Tras fijar la salida"],["Consultar disponibilidad de espacios","Pendiente","Antes de reservar"],["Resolver luz, acústica, suelo y lluvia","Pendiente","Según alternativa"],["Confirmar tren y alternativa de transporte","Pendiente","Antes de cerrar horarios"],["Confirmar fecha completa: 27 de noviembre, año sin indicar","Pendiente","Antes de cerrar agenda"]],"timelineSource":"https://docs.google.com/document/d/1QFsa3iLwJ6NODrwrrUIZAYuv72HByfwpKRAwZqwmF0o/edit"};
